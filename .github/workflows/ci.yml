name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securescan
          POSTGRES_PASSWORD: securescan
          POSTGRES_DB: securescan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install tree-sitter tree-sitter-python
          # CPU-only torch: CI never trains, it only needs the import to work.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers

      - name: Lint
        run: ruff check backend ml tests

      - name: Format check
        run: ruff format --check backend ml tests

      - name: Test
        env:
          # The suite runs on SQLite (see tests/conftest.py); the Postgres
          # service is here for the migration check below.
          PYTHONPATH: backend:ml
        run: pytest tests -v --cov=backend/app --cov=ml/securescan_ml --cov-report=term-missing

      - name: Verify migrations apply cleanly
        env:
          SECURESCAN_DATABASE_URL: postgresql+psycopg://securescan:securescan@localhost:5432/securescan_test
          PYTHONPATH: backend:ml
        working-directory: backend
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run build
